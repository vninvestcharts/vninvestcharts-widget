name: Deploy to Server (Reusable)

on:
  workflow_call:
    inputs:
      image-tag:
        required: false
        type: string
        default: ""
        description: Docker image tag to deploy (defaults to latest)
    secrets:
      server-host:
        required: true
        description: Target server hostname
      server-user:
        required: true
        description: SSH username on target server
      server-ssh-key:
        required: true
        description: SSH private key for deployment
      ghcr-user:
        required: true
        description: GHCR username
      ghcr-pat:
        required: true
        description: GHCR personal access token

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://stockchart.edusuccess.vn
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Copy docker-compose.prod.yml and server config to server
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.server-host }}
          username: ${{ secrets.server-user }}
          key: ${{ secrets.server-ssh-key }}
          source: "docker-compose.prod.yml,server/**"
          target: "~/stockchart"
          strip_components: 0

      - name: Deploy on server
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.server-host }}
          username: ${{ secrets.server-user }}
          key: ${{ secrets.server-ssh-key }}
          script: |
            set -e
            echo "${{ secrets.ghcr-pat }}" | docker login ghcr.io \
              -u ${{ secrets.ghcr-user }} --password-stdin
            cd ~/stockchart
            # Use latest tag from current input or fall back to hardcoded latest
            IMAGE_TAG="${{ inputs.image-tag }}"
            if [ -z "$IMAGE_TAG" ]; then
              IMAGE_TAG="ghcr.io/vietdungiitb/klinestockchart:latest"
            fi
            docker pull "$IMAGE_TAG"
            # VER-03: the previously-running image IS the rollback target, so
            # record its tag BEFORE swapping. `docker compose up` retags the
            # old image as `<none>:<none>` dangling once it is replaced.
            PREV_IMAGE="$(docker inspect --format='{{.Image}}' "$(docker compose -f docker-compose.prod.yml ps -q stockchart 2>/dev/null | head -1)" 2>/dev/null || true)"
            echo "Previous image id: ${PREV_IMAGE:-none}"
            echo "PREV_IMAGE=${PREV_IMAGE}" >> "$GITHUB_ENV"
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            # VER-03: `docker image prune -f` used to run here and DELETED the
            # rollback candidate, making a documented image-tag rollback
            # impossible. Only dangling layers are now removed, and the previous
            # image is pinned by digest so it stays pullable during an incident.
            if [ -n "$PREV_IMAGE" ] && [ "$PREV_IMAGE" != "null" ]; then
              docker tag "$PREV_IMAGE" "ghcr.io/vietdungiitb/klinestockchart:rollback-candidate"
              echo "Rollback candidate retained: ghcr.io/vietdungiitb/klinestockchart:rollback-candidate"
            fi
            docker image prune -f --filter "dangling=false" || true
            echo "Deploy OK: $(date)"

      - name: Verify deployment (health assertion, auto-revert)
        shell: bash
        run: |
          # VER-03: the old step was `sleep 10` + echo + a URL, so a broken
          # deploy stayed live and nothing reverted it. Now poll the real
          # health endpoint that generate-health.js bakes into the image
          # (Dockerfile HEALTHCHECK uses the same /health.json contract).
          set -o pipefail
          HEALTH_URL="https://${{ secrets.server-host }}/health.json"
          OK=0
          for i in $(seq 1 12); do
            # generate-health.js writes JSON.stringify(..., null, 2), so the key
            # is `"ok": true` WITH a space — a literal '"ok":true' grep would
            # never match and every deploy would auto-revert.
            if curl -fsS --max-time 10 "$HEALTH_URL" | tee health.json | grep -qE '"ok"[[:space:]]*:[[:space:]]*true'; then
              OK=1
              echo "Health OK after $((i * 10))s: $(cat health.json)"
              break
            fi
            echo "Waiting for health ($((i * 10))s)..."
            sleep 10
          done
          if [ "$OK" -ne 1 ]; then
            echo "FATAL: deployment unhealthy at $HEALTH_URL"
            PREV="${PREV_IMAGE:-}"
            if [ -n "$PREV" ] && [ "$PREV" != "null" ]; then
              echo "Auto-reverting to previous image $PREV"
              docker tag "$PREV" "ghcr.io/vietdungiitb/klinestockchart:latest"
              docker compose -f docker-compose.prod.yml up -d --force-recreate
              echo "Rollback attempted at $(date)"
            else
              echo "No previous image recorded; manual rollback required."
            fi
            exit 1
          fi
          echo "Deployment verified: $(cat health.json)"
