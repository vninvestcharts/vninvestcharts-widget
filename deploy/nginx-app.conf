server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        font/woff2;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------------------------------------------------------------------
    # REL-05 / D-04 — allowlist đối tác cho `frame-ancestors`.
    #
    # TRẠNG THÁI: allowlist đối tác **CHƯA BẬT**. `SECURITY_REVIEW` bắt buộc của
    # SLICE-REL-05 chưa từng chạy (đo 2026-10-14: `gh run list` cho thấy 99 run
    # liên tiếp, tất cả dừng ở bước khởi động job vì billing ⇒ cổng review, nếu
    # nó tồn tại, cũng chưa từng chạy). Comment cũ ở đây mô tả một allowlist
    # "đã được hướng dẫn" như thể nó tồn tại — nó không.
    #
    # CÁCH BẬT (không cần sửa file này — chỉ sửa *deploy config*):
    #   1. Submitserver truyền `PARTNER_FRAME_ANCESTORS` trong `docker-compose` /
    #      `.env` của môi trường, ví dụ
    #         PARTNER_FRAME_ANCESTORS="'self' https://partner-a.example https://partner-b.example"
    #   2. Ở đây: `include /etc/nginx/partner-frame-ancestors.conf;` được nạp, và
    #      biến dưới đây thay `'self'`.
    #
    # YÊU CẦU KHÔNG THỎA THIỆN (giữ nguyên khi chưa có review):
    #   * KHÔNG bao giờ dùng `*` — đó là allowlist bằng cách từ bỏ allowlist.
    #   * KHÔNG nhét `http://localhost:3000` / `:5173` vào production. Chỉ dùng
    #     https và domain thật.
    #   * KHÔNG bật ở production trước khi `SECURITY_REVIEW` ký. Việc kỹ thuật
    #     (cấu hình hoá) đã xong; việc bật là quyết định của người ký.
    #
    # Nếu biến rỗng ⇒ `'self'`: **fail-closed**. Quên cấu hình thì widget không
    # nhúng được ở đâu cả, chứ không nhúng được ở mọi nơi.
    #
    # File include CÓ sẵn trong image (Dockerfile COPY) nên `nginx -t` không vỡ khi
    # chưa cấu hình. Mount file khác đè lên nó để bật đối tác — không cần build lại.
    set $partner_frame_ancestors "'self'";
    include /etc/nginx/partner-frame-ancestors.conf;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # REL-05: iframe embed surface. MUST be declared before the generic
    # `location /` so it is not swallowed by the app CSP.
    #
    # SECURITY: `frame-ancestors` là allowlist, không bao giờ là `*`. Bật đối tác =
    # đặt `PARTNER_FRAME_ANCESTORS` ở deploy config (xem khối `set $partner_...` phía
    # trên); KHÔNG sửa file này. Cổng review bắt buộc: SECURITY_REVIEW của
    # SLICE-REL-05 — **chưa từng chạy**, xem `docs/DECISION_PM_2026-10-14.md` §Q2.
    # Mọi thứ không nằm trong allowlist bị trình duyệt chặn.
    #
    # `X-Frame-Options` cố tình KHÔNG đặt ở đây: nó không diễn đạt được allowlist
    # origin, còn SAMEORIGIN sẽ vô hiệu hoá việc nhúng cross-domain. XFO chỉ là
    # fallback cho trình duyệt rất cũ; CSP là thứ có quyền quyết định.
    #
    # VER-03 `^~` IS LOAD-BEARING. nginx resolves regex locations BEFORE
    # plain prefix locations, so without `^~` the generic asset rule above
    # (line 27) also matched /iframe/*.js and /iframe/*.css — serving the
    # embed shell with `expires 1y; immutable` even though the shell asset
    # names are NOT content-hashed (build-all.js loads the fixed
    # "./vninvestchart.iframe.js"). A rollback re-shipping the same filename
    # was then invisible to returning browsers for up to a year, which makes
    # rollback impossible exactly when it is needed.
    location ^~ /iframe/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.example.invalid; frame-ancestors $partner_frame_ancestors; object-src 'none'; base-uri 'self'" always;
        # Unversioned filenames => revalidate every load (cheap 304, never a
        # stale bundle). Do NOT raise this to a long max-age: a rollback
        # re-ships identical URLs, so any long cache would mask it.
        add_header Cache-Control "no-cache, must-revalidate" always;
        # SEC-02: never serve the raw demo drawing store on this surface.
        try_files $uri $uri/ =404;
    }

    # ── Binance WebSocket streaming ──────────────────────────────────────────
    # Added 2026-10-13. The webpack dev server has proxied /binance-ws-proxy all
    # along; the production conf did NOT, so the production build had to reach
    # wss://stream.binance.com:9443 from the browser — a non-standard port that is
    # both blocked by this app's own CSP and unreachable from clients in regions
    # Binance restricts.
    #
    # Routing it SAME-ORIGIN means the browser talks only to this host, so:
    #   * `connect-src 'self'` already covers it — no new external origin in CSP;
    #   * the VPS does the upstream call, so it works for any client regardless of
    #     where that client is.
    #
    # `proxy_buffering off` + long read timeout: this is a long-lived stream, and
    # nginx's default 60s read timeout would kill it every minute.
    # The trailing slash on proxy_pass is LOAD-BEARING, exactly like the REST block
    # below. With a prefix location and no URI part, nginx forwards the ORIGINAL URI,
    # so Binance would receive `/binance-ws-proxy/ws/btcusdt@kline_1m` and answer 404.
    # With the trailing slash nginx replaces the matched prefix by `/`, so upstream sees
    # `/ws/btcusdt@kline_1m`. Measured: without it, both paths returned 404.
    location /binance-ws-proxy/ {
        proxy_pass https://stream.binance.com:9443/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host stream.binance.com;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        access_log off;
    }

    # ── VNInvest core API ────────────────────────────────────────────────────
    # The demo sets __VNI_API_BASE__ to this host, which already answers
    # OPERATOR: replace api.example.invalid with your backend host.
    # `Access-Control-Allow-Origin: https://charts.example.invalid` (verified 401 +
    # OPTIONS preflight 200), so a direct cross-origin call is allowed and no
    # reverse proxy is needed. This block exists only to make the CSP allow it.
    # Verified upstream: GET /core/v1/auth/me -> 401
    #   {"code":"authentication_error","instance":"/core/v1/auth/me", ...}

    location / {
        # BL-11: scoped to the app only (NOT server-level) so the /iframe/
        # surface keeps its own allowlist for cross-domain embeds.
        # NOTE: any add_header here disables server-level inheritance, so the
        # base headers are repeated. Allowances calibrated to
        # src/demo/index.html (Google Fonts + inline <style>), canvas export
        # (data:/blob:), REST/WS backends and the same-origin /binance-proxy/.
        # Tighten connect-src after 1-week soak.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://api.example.invalid https://api.binance.com; frame-ancestors $partner_frame_ancestors; object-src 'none'; base-uri 'self'" always;
        try_files $uri $uri/ /index.html;
    }

    location /binance-proxy/ {
        proxy_pass https://api.binance.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.binance.com;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "$http_origin" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        access_log off;
    }

    # SEC-02: the drawing store at server/drawingServer.js is a LOCAL DEMO ONLY.
    # It has no authentication, no tenant isolation and keys data by
    # `symbol:timeframe`, so proxying it from a public deployment would let any
    # caller read/overwrite every user's drawings.
    #
    # The upstream is therefore BLOCKED in this production config. To run the
    # demo locally, use the dev server directly — do not re-enable this proxy.
    # A real deployment must implement auth + tenant isolation first and add its
    # own reviewed location block (see SLICE-SEC-02).
    location /api/drawings {
        return 404;
    }

    location = /health.json {
        root /usr/share/nginx/html;
        add_header Content-Type application/json;
        access_log off;
    }

    location = /health {
        root /usr/share/nginx/html;
        try_files /health.json =404;
        add_header Content-Type application/json;
        access_log off;
    }
}
