# REL-05 / D-04 — allowlist `frame-ancestors` cho embed cross-domain.
#
# File này ĐỊNH NGHĨA LẠI biến `$partner_frame_ancestors` mà `nginx-app.conf` khai ở
# khối `server`. Nhờ vậy bật đối tác là thay đổi *deploy config*, KHÔNG phải thay đổi
# source nginx — không cần build lại image, không cần sửa file trong repo.
#
# ## CÁCH BẬT (2 bước)
#
# 1. Sửa đúng dòng `set $partner_frame_ancestors ...` bên dưới, hoặc mount một file
#    khác đè lên vị trí này trong `docker-compose.prod.yml`:
#
#        set $partner_frame_ancestors "'self' https://partner-a.example https://partner-b.example";
#
# 2. `nginx -t` rồi reload.
#
# ## BA ĐIỀU KHÔNG ĐƯỢC LÀM
#
#   * KHÔNG dùng `*`. Đó là allowlist bằng cách từ bỏ allowlist — mọi website có thể
#     nhúng widget của bạn và giả dạng nó trong một phishing frame.
#   * KHÔNG nhét `http://localhost:3000` / `http://localhost:5173` vào production.
#     Chỉ `https` và domain thật.
#   * KHÔNG bật ở production trước khi `SECURITY_REVIEW` của SLICE-REL-05 ký. Cổng đó
#     **chưa từng chạy** (CI đỏ vì billing — `docs/DECISION_PM_2026-10-14.md` §Q4).
#     Kỹ thuật đã sẵn sàng; bật là quyết định của người ký, không phải của kỹ sư.
#
# Mặc định `'self'` là **fail-closed**: quên cấu hình thì widget không nhúng được ở
# đâu cả — chấp nhận được — chứ không nhúng được ở mọi nơi — không chấp nhận được.

set $partner_frame_ancestors "'self'";
